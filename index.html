<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سیستم ثبت موبایل</title>
<style>*{box-sizing:border-box}body{font-family:Tahoma,Arial;background:#f3f4f6;margin:0;color:#111827}.wrap{max-width:980px;margin:auto;padding:12px}.card{background:#fff;padding:16px;border-radius:14px;margin:12px 0;box-shadow:0 2px 10px #0001}h1{text-align:center;color:#2563eb}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{font-weight:bold;font-size:14px}input{width:100%;padding:11px;margin-top:5px;border:1px solid #d1d5db;border-radius:8px;font-size:15px}button{padding:10px 14px;border:0;border-radius:8px;margin:5px 3px;font-weight:bold}.blue{background:#2563eb;color:#fff}.gray{background:#e5e7eb}.red{background:#dc2626;color:#fff}.hidden{display:none!important}.login{max-width:430px;margin:60px auto;text-align:center}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:right;font-size:13px}.table{overflow:auto}.status{padding:9px;background:#eff6ff;border-radius:9px;font-size:13px}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head>
<body>
<div id="login" class="wrap"><div class="card login"><h1>🔐 ورود</h1><p>رمز عبور را وارد کنید.</p><input id="password" type="password" placeholder="رمز عبور"><button class="blue" id="loginBtn">ورود</button><p id="loginMsg"></p></div></div>
<div id="app" class="wrap hidden"><div class="card"><h1>📱 لیست خرید موبایل</h1><div class="status" id="status">آماده</div></div>
<div class="card"><form id="form"><input type="hidden" id="editId"><div class="grid"><div><label>نام</label><input id="name" required></div><div><label>نام موبایل</label><input id="phone" required></div><div><label>نمبر تذکره</label><input id="tazkira"></div><div><label>شماره تماس</label><input id="contact"></div><div class="full"><label>IMEI</label><input id="imei" required></div></div><button class="blue" type="submit">➕ ثبت خرید</button><button class="gray" type="button" id="cancel">لغو</button></form></div>
<div class="card"><input id="search" placeholder="🔎 جستجو..."><div class="table"><table><thead><tr><th>#</th><th>نام</th><th>موبایل</th><th>تذکره</th><th>تماس</th><th>IMEI</th><th>تاریخ</th><th>عملیات</th></tr></thead><tbody id="list"></tbody></table></div><p id="empty">موردی ثبت نشده است.</p></div>
<div class="card"><h3>⚙️ همگام‌سازی GitHub</h3><p>داده‌ها قبل از ذخیره در GitHub با AES-GCM رمزنگاری می‌شوند.</p><div class="grid"><div><label>GitHub Owner</label><input id="owner"></div><div><label>Repository</label><input id="repo"></div><div><label>Branch</label><input id="branch" value="main"></div><div><label>GitHub Token</label><input id="token" type="password"></div></div><button class="blue" id="sync">☁️ دریافت</button><button class="gray" id="push">💾 ذخیره</button><button class="red" id="logout">خروج</button></div></div>
<script>
const E=new TextEncoder(),D=new TextDecoder(),F="data.enc";let items=[],key,salt;
const $=x=>document.getElementById(x),b=a=>btoa(String.fromCharCode(...new Uint8Array(a))),u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dk(p,s){return crypto.subtle.deriveKey({name:"PBKDF2",salt:s,iterations:310000,hash:"SHA-256"},await crypto.subtle.importKey("raw",E.encode(p),{name:"PBKDF2"},false,["deriveKey"]),{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function decrypt(pkg,p){let s=u(pkg.salt),k=await dk(p,s),x=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(pkg.iv)},k,u(pkg.data));return{k,s,items:JSON.parse(D.decode(x))}}
async function encrypt(){let iv=crypto.getRandomValues(new Uint8Array(12)),x=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,E.encode(JSON.stringify(items)));return JSON.stringify({v:1,salt:b(salt),iv:b(iv),data:b(x)})}
function api(){return `https://api.github.com/repos/${encodeURIComponent($("owner").value.trim())}/${encodeURIComponent($("repo").value.trim())}/contents/${F}`}
async function remote(){let r=await fetch(api()+`?ref=${encodeURIComponent($("branch").value||"main")}`);if(!r.ok)throw Error();let x=await r.json();return{p:JSON.parse(D.decode(u(x.content.replace(/\\n/g,"")))),sha:x.sha}}
async function login(){try{let r=await remote(),x=await decrypt(r.p,$("password").value);key=x.k;salt=x.s;items=x.items;if(!Array.isArray(items))throw Error();$("login").classList.add("hidden");$("app").classList.remove("hidden");render();$("status").textContent="☁️ اطلاعات دریافت شد."}catch(e){$("loginMsg").textContent="رمز اشتباه است یا data.enc درست تنظیم نشده است."}}
function render(){let q=$("search").value.toLowerCase(),a=items.filter(x=>Object.values(x).join(" ").toLowerCase().includes(q));$("list").innerHTML=a.map((x,i)=>`<tr><td>${i+1}</td><td>${x.name}</td><td>${x.phone}</td><td>${x.tazkira}</td><td>${x.contact}</td><td>${x.imei}</td><td>${x.date}</td><td><button class=gray onclick="edit('${x.id}')">ویرایش</button><button class=red onclick="del('${x.id}')">حذف</button></td></tr>`).join("");$("empty").style.display=a.length?"none":"block"}
$("form").onsubmit=e=>{e.preventDefault();let id=$("editId").value,d={name:$("name").value.trim(),phone:$("phone").value.trim(),tazkira:$("tazkira").value.trim(),contact:$("contact").value.trim(),imei:$("imei").value.trim()};if(id){let i=items.findIndex(x=>x.id==id);items[i]={...items[i],...d}}else items.unshift({id:Date.now().toString(),...d,date:new Date().toLocaleDateString("fa-AF")});render();$("form").reset();$("editId").value=""}
window.edit=id=>{let x=items.find(x=>x.id==id);$("editId").value=id;$("name").value=x.name;$("phone").value=x.phone;$("tazkira").value=x.tazkira;$("contact").value=x.contact;$("imei").value=x.imei}
window.del=id=>{if(confirm("حذف شود؟")){items=items.filter(x=>x.id!=id);render()}}
$("search").oninput=render;$("cancel").onclick=()=>$("form").reset();
$("sync").onclick=async()=>{try{let r=await remote(),x=await decrypt(r.p,$("password").value);key=x.k;salt=x.s;items=x.items;render();$("status").textContent="☁️ به‌روزرسانی شد."}catch(e){$("status").textContent="❌ دریافت ناموفق."}};
$("push").onclick=async()=>{try{let c=$("token").value.trim();if(!c)throw Error("token");let old=null;try{old=await remote()}catch(e){}let body={message:"Update encrypted data",content:b(E.encode(await encrypt())),branch:$("branch").value||"main"};if(old)body.sha=old.sha;let r=await fetch(api(),{method:"PUT",headers:{"Authorization":"Bearer "+c,"Accept":"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify(body)});if(!r.ok)throw Error();$("status").textContent="✅ در GitHub ذخیره شد."}catch(e){$("status").textContent="❌ ذخیره ناموفق؛ Token و Repository را بررسی کنید."}};
$("logout").onclick=()=>location.reload();$("loginBtn").onclick=login;$("password").onkeydown=e=>e.key=="Enter"&&login();
</script></body></html>
