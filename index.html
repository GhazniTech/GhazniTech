<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>کارهای روزمره</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // ==============================
  // Supabase تنظیمات
  // ==============================
  const SUPABASE_PROJECT_URL = "YOUR_SUPABASE_PROJECT_URL";
  const SUPABASE_PUBLISHABLE_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";
</script>

</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">برنامه شخصی</div>
        <h1>کارهای روزمره</h1>
        <div id="today" class="today"></div>
      </div>
      <button id="addBtn" class="primary">＋ اضافه</button>
    </header>

    <section class="stats">
      <div><b id="totalCount">۰</b><span>همه</span></div>
      <div><b id="pendingCount">۰</b><span>باقی‌مانده</span></div>
      <div><b id="doneCount">۰</b><span>انجام‌شده</span></div>
    </section>

    <section class="toolbar">
      <input id="search" placeholder="جستجوی کار..." autocomplete="off">
      <select id="filter">
        <option value="all">همه کارها</option>
        <option value="pending">انجام‌نشده</option>
        <option value="done">انجام‌شده</option>
      </select>
    </section>

    <section id="list" class="task-list"></section>
    <div id="empty" class="empty hidden">هنوز کاری ثبت نشده است.</div>
  </main>

  <dialog id="taskDialog">
    <form id="taskForm" method="dialog" class="modal">
      <div class="modal-head">
        <h2 id="modalTitle">اضافه کردن کار</h2>
        <button type="button" id="closeBtn" class="icon-btn">×</button>
      </div>
      <input type="hidden" id="taskId">
      <label>عنوان کار
        <input id="title" required maxlength="120" placeholder="مثلاً مطالعه">
      </label>
      <label>جزئیات
        <textarea id="details" maxlength="1000" placeholder="توضیحات کار..."></textarea>
      </label>
      <div class="grid2">
      </div>
      <label class="check"><input id="reminder" type="checkbox"> یادآوری فعال باشد</label>
      <div class="auto-register-note">🕒 تاریخ و ساعت ثبت این کار هنگام فشردن «ذخیره» به‌صورت خودکار از زمان فعلی ثبت می‌شود.</div>
<div class="modal-actions">
        <button type="button" id="cancelBtn" class="secondary">انصراف</button>
        <button class="primary" type="submit">ذخیره</button>
      </div>
      <p id="formError" class="error"></p>
    </form>
  </dialog>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
