<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لیست خرید موبایل</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f7;font-family:Tahoma,Arial,sans-serif;color:#222;padding:15px}
.container{max-width:1000px;margin:auto;background:#fff;padding:18px;border-radius:15px;box-shadow:0 3px 15px #0002}
h1{text-align:center;font-size:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
input,button{width:100%;padding:12px;margin:4px 0;border-radius:9px;border:1px solid #ccc;font-size:15px}
button{border:0;background:#1976d2;color:white;cursor:pointer}
button.red{background:#d32f2f}
button.gray{background:#555}
.info{background:#eef6ff;padding:10px;border-radius:9px;margin:10px 0}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{border:1px solid #ddd;padding:8px;text-align:right}
th{background:#eee}
@media(max-width:600px){table{font-size:12px}th,td{padding:5px}}
</style>
</head>
<body>
<div class="container">
<h1>لیست خرید موبایل</h1>

<div class="grid">
<input id="name" placeholder="نام">
<input id="mobile" placeholder="نام موبایل">
<input id="tazkira" placeholder="نمبر تذکره">
<input id="phone" placeholder="شماره تماس">
<input id="imei" placeholder="IMEI">
</div>

<div class="grid">
<button onclick="saveRecord()">ثبت اطلاعات</button>
<button class="gray" onclick="clearForm()">پاک کردن</button>
</div>

<input id="search" placeholder="جستجو..." oninput="render()">

<div class="info">
اطلاعات در این مرورگر ذخیره می‌شود و برای استفاده در چند گوشی، می‌توانی فایل داده را در GitHub نگهداری کنی.
</div>

<div class="grid">
<button onclick="downloadData()">دانلود پشتیبان</button>
<button onclick="document.getElementById('fileInput').click()">وارد کردن پشتیبان</button>
<input id="fileInput" type="file" accept=".json" style="display:none" onchange="importData(event)">
</div>

<table>
<thead>
<tr>
<th>نام</th>
<th>موبایل</th>
<th>تذکره</th>
<th>تماس</th>
<th>IMEI</th>
<th>عملیات</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>
</div>

<script>
let records=[];
let editIndex=-1;

function load(){
  try{records=JSON.parse(localStorage.getItem("mobile_records")||"[]")}
  catch(e){records=[]}
  render();
}

function saveLocal(){
  localStorage.setItem("mobile_records",JSON.stringify(records));
  render();
}

function saveRecord(){
  const r={
    name:document.getElementById("name").value.trim(),
    mobile:document.getElementById("mobile").value.trim(),
    tazkira:document.getElementById("tazkira").value.trim(),
    phone:document.getElementById("phone").value.trim(),
    imei:document.getElementById("imei").value.trim()
  };
  if(!r.name&&!r.mobile&&!r.tazkira&&!r.phone&&!r.imei){
    alert("لطفاً اطلاعات را وارد کنید.");
    return;
  }
  if(editIndex>=0){
    records[editIndex]=r;
    editIndex=-1;
  }else{
    records.push(r);
  }
  saveLocal();
  clearForm();
}

function editRecord(i){
  const r=records[i];
  document.getElementById("name").value=r.name||"";
  document.getElementById("mobile").value=r.mobile||"";
  document.getElementById("tazkira").value=r.tazkira||"";
  document.getElementById("phone").value=r.phone||"";
  document.getElementById("imei").value=r.imei||"";
  editIndex=i;
  window.scrollTo({top:0,behavior:"smooth"});
}

function deleteRecord(i){
  if(confirm("این اطلاعات حذف شود؟")){
    records.splice(i,1);
    saveLocal();
  }
}

function clearForm(){
  ["name","mobile","tazkira","phone","imei"].forEach(id=>document.getElementById(id).value="");
  editIndex=-1;
}

function esc(v){
  return String(v||"").replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}

function render(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  const tbody=document.getElementById("rows");
  tbody.innerHTML="";
  records.forEach((r,i)=>{
    const all=Object.values(r).join(" ").toLowerCase();
    if(q && !all.includes(q)) return;
    tbody.innerHTML+=`
    <tr>
      <td>${esc(r.name)}</td>
      <td>${esc(r.mobile)}</td>
      <td>${esc(r.tazkira)}</td>
      <td>${esc(r.phone)}</td>
      <td>${esc(r.imei)}</td>
      <td>
        <button onclick="editRecord(${i})">ویرایش</button>
        <button class="red" onclick="deleteRecord(${i})">حذف</button>
      </td>
    </tr>`;
  });
}

function downloadData(){
  const blob=new Blob([JSON.stringify(records,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="data.json";
  a.click();
  URL.revokeObjectURL(a.href);
}

function importData(event){
  const file=event.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!Array.isArray(data))throw new Error();
      records=data;
      saveLocal();
      alert("اطلاعات وارد شد.");
    }catch(e){
      alert("فایل پشتیبان معتبر نیست.");
    }
    event.target.value="";
  };
  reader.readAsText(file);
}

load();
</script>
</body>
</html>
