<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ساخت data.enc</title><style>body{font-family:Tahoma;max-width:600px;margin:40px auto;padding:20px}input,button{padding:12px;width:100%;margin:6px 0}button{background:#2563eb;color:#fff;border:0;border-radius:8px}</style><h2>ساخت data.enc اولیه</h2><p>همان رمز را بعداً در صفحه اصلی استفاده کن.</p><input id=p type=password placeholder="رمز حداقل ۸ حرف"><button onclick=go()>ساخت فایل</button><p id=m></p><script>const e=new TextEncoder(),b=a=>btoa(String.fromCharCode(...new Uint8Array(a)));async function go(){let p=document.getElementById("p").value;if(p.length<8){m.textContent="رمز کوتاه است";return}let s=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:s,iterations:310000,hash:"SHA-256"},await crypto.subtle.importKey("raw",e.encode(p),{name:"PBKDF2"},false,["deriveKey"]),{name:"AES-GCM",length:256},false,["encrypt","decrypt"]),c=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,e.encode("[]")),x=JSON.stringify({v:1,salt:b(s),iv:b(iv),data:b(c)}),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([x],{type:"application/json"}));a.download="data.enc";a.click();m.textContent="data.enc ساخته شد."}</script>
